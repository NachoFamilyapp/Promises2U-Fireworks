
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080817">
<title>Promises2U Fireworks</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#080817;color:white;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#screen{
 position:fixed;top:22px;left:25px;z-index:2;
 font-size:12px;letter-spacing:3px;color:#b9bad5
}
#number{font-size:23px;color:white;font-weight:bold;margin-top:7px}
#controller{
 position:relative;z-index:5;max-width:650px;
 max-height:95vh;overflow:auto;
 margin:25px auto;padding:24px;
 background:#15152c;border:1px solid #393958;
 border-radius:20px
}
#controller h1{margin-top:0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
 border:0;border-radius:12px;padding:16px;
 font-size:16px;font-weight:bold;cursor:pointer;
 background:#34345d;color:white
}
button.start{background:#d9a52c;color:#171020}
button.stop{background:#9b3548}
button.snow{background:#397eaa}
button:disabled{opacity:.5;cursor:not-allowed}
select,input{
 width:100%;padding:14px;border-radius:10px;
 background:#242442;color:white;border:1px solid #555
}
.note{color:#b8b8d3;font-size:13px;line-height:1.6}
.hidden{display:none!important}
.section-title{margin:22px 0 10px;font-size:17px}
@media(max-width:600px){
 #controller{margin:12px;padding:18px}
 .controls{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div id="screen">
 PROMISES2U · FIREWORKS
 <div id="number">BROWSER 1</div>
</div>

<div id="controller" class="hidden">
 <h1>🎆 Promises2U Controller</h1>

 <div id="login">
  <p class="note">Log in met je Firebase-beheeraccount.</p>
  <input id="email" type="email" placeholder="E-mailadres" autocomplete="username">
  <input id="password" type="password" placeholder="Wachtwoord" autocomplete="current-password">
  <button class="start" id="loginButton">INLOGGEN</button>
  <p class="note" id="loginStatus">Beveiligde beheerlogin.</p>
 </div>

 <div id="controlsArea" class="hidden">
  <p class="note">Beheeraccount ingelogd.</p>

  <label for="target">Selecteer scherm voor vuurwerk</label>
  <select id="target">
   <option value="all">Alle browsers</option>
   <option value="1">Browser 1</option>
   <option value="2">Browser 2</option>
   <option value="3">Browser 3</option>
   <option value="4">Browser 4</option>
   <option value="5">Browser 5</option>
  </select>

  <h2 class="section-title">🎆 Vuurwerk</h2>
  <div class="controls">
   <button class="start" data-action="start">▶ START</button>
   <button data-action="pause">Ⅱ PAUZE</button>
   <button class="stop" data-action="stop">■ STOP</button>
   <button data-action="resume">↻ HERVAT</button>
  </div>

  <h2 class="section-title">❄️ Magische sneeuw</h2>
  <p class="note">Bij 'Alle browsers' wordt sneeuw alleen op hoofdscherm 1 en 2 getoond.</p>
  <div class="controls">
   <button class="snow" data-action="snow-on">❄️ SNEEUW AAN</button>
   <button data-action="snow-off">SNEEUW UIT</button>
  </div>

  <p class="note" id="status">Controller gereed.</p>
  <button id="logoutButton">UITLOGGEN</button>
 </div>
</div>

<script type="module">
import { initializeApp } from
 "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
 getAuth, signInWithEmailAndPassword,
 signInAnonymously, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
 getDatabase, ref, set, onValue
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
 apiKey: "AIzaSyCeSW4dzzMZStmrI9FngSKC6HXNi51Doh0",
 authDomain: "promises2u-fireworks.firebaseapp.com",
 databaseURL: "https://promises2u-fireworks-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "promises2u-fireworks",
 storageBucket: "promises2u-fireworks.firebasestorage.app",
 messagingSenderId: "270417648985",
 appId: "1:270417648985:web:9ae68d53bbb78ca102c048"
};

const ADMIN_UID = "9FoU4AHM14W5VsIMJQviVRzIZD92";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

/* PAGINA */
const params = new URLSearchParams(location.search);
const controller = params.has("controller");
const browser = Math.min(5,Math.max(1,Number(params.get("browser"))||1));

const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
const palette = [
 ["#ffd166","#ffb703","#fff1a8","#ffffff"],
 ["#70d6ff","#b388ff","#f15bb5","#ffffff"],
 ["#ff595e","#ffca3a","#ffffff","#ff924c"],
 ["#80ed99","#57cc99","#caffbf","#ffffff"],
 ["#ff70a6","#ffd670","#70d6ff","#ffffff"]
];

document.getElementById("number").textContent = "BROWSER "+browser;

if(controller){
 document.getElementById("controller").classList.remove("hidden");
 document.getElementById("screen").classList.add("hidden");
}

/* CANVAS */
let W=0,H=0;
let rockets=[];
let particles=[];
let snowflakes=[];
let fireworksRunning=true;
let snowRunning=false;

function resize(){
 const ratio=window.devicePixelRatio||1;
 canvas.width=innerWidth*ratio;
 canvas.height=innerHeight*ratio;
 ctx.setTransform(ratio,0,0,ratio,0,0);
 W=innerWidth;
 H=innerHeight;
}
addEventListener("resize",resize);
resize();

/* VUURWERK */
function burst(x,y,colors){
 const amount=65+Math.random()*55;
 for(let i=0;i<amount;i++){
  const a=Math.random()*Math.PI*2;
  const speed=1.2+Math.random()*5.5;
  particles.push({
   x,y,
   vx:Math.cos(a)*speed,
   vy:Math.sin(a)*speed,
   life:1,
   decay:.007+Math.random()*.012,
   color:colors[Math.floor(Math.random()*colors.length)],
   size:1+Math.random()*2.5
  });
 }
}

function launch(){
 const colors=palette[browser-1];
 rockets.push({
  x:W*(.12+Math.random()*.76),
  y:H+5,
  target:H*(.13+Math.random()*.55),
  speed:4+Math.random()*3,
  color:colors[Math.floor(Math.random()*colors.length)],
  colors
 });
}

/* MAGISCHE SNEEUW */
function createSnow(){
 snowflakes=[];
 const amount=Math.max(70,Math.min(220,Math.round(W*H/6500)));
 for(let i=0;i<amount;i++){
  snowflakes.push({
   x:Math.random()*W,
   y:Math.random()*H,
   radius:.7+Math.random()*2.8,
   speed:.45+Math.random()*1.5,
   drift:Math.random()*.8+.2,
   phase:Math.random()*Math.PI*2,
   glow:Math.random()
  });
 }
}
createSnow();

function drawSnow(){
 for(const f of snowflakes){
  f.phase+=.012;
  f.y+=f.speed;
  f.x+=Math.sin(f.phase)*f.drift;

  if(f.y>H+8){
   f.y=-8;
   f.x=Math.random()*W;
  }
  if(f.x>W+8)f.x=-8;
  if(f.x<-8)f.x=W+8;

  const alpha=.48+f.glow*.45;
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.shadowBlur=7+f.glow*9;
  ctx.shadowColor="#b8e9ff";
  ctx.fillStyle=f.glow>.72?"#ffffff":"#d9f2ff";
  ctx.beginPath();
  ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
 }
}

/* ANIMATIE */
function draw(){
 requestAnimationFrame(draw);

 if(!fireworksRunning&&!snowRunning)return;

 ctx.fillStyle="rgba(8,8,23,0.20)";
 ctx.fillRect(0,0,W,H);

 if(snowRunning)drawSnow();

 if(fireworksRunning){
  if(Math.random()<.035)launch();

  rockets=rockets.filter(r=>{
   r.y-=r.speed;
   ctx.beginPath();
   ctx.arc(r.x,r.y,2.5,0,Math.PI*2);
   ctx.fillStyle=r.color;
   ctx.fill();

   if(r.y<=r.target){
    burst(r.x,r.y,r.colors);
    return false;
   }
   return true;
  });

  particles=particles.filter(p=>{
   p.x+=p.vx;
   p.y+=p.vy;
   p.vy+=.045;
   p.vx*=.985;
   p.life-=p.decay;
   ctx.globalAlpha=Math.max(0,p.life);
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
   ctx.fillStyle=p.color;
   ctx.fill();
   return p.life>0;
  });
  ctx.globalAlpha=1;
 }
}
draw();

/* OPDRACHTEN */
function clearFireworks(){
 fireworksRunning=false;
 rockets=[];
 particles=[];
}

function applyCommand(data){
 if(!data||!data.action)return;

 if(data.action==="snow-on"||data.action==="snow-off"){
  // Sneeuw is uitsluitend bedoeld voor hoofdschermen 1 en 2.
  if(browser>2)return;
  if(data.target!=="all"&&Number(data.target)!==browser)return;

  clearFireworks();
  snowRunning=data.action==="snow-on";
  ctx.clearRect(0,0,W,H);
  return;
 }

 if(data.target!=="all"&&Number(data.target)!==browser)return;

 if(data.action==="start"){
  snowRunning=false;
  fireworksRunning=true;
  particles=[];
  rockets=[];
 }
 if(data.action==="resume"){
  snowRunning=false;
  fireworksRunning=true;
 }
 if(data.action==="pause"){
  fireworksRunning=false;
 }
 if(data.action==="stop"){
  fireworksRunning=false;
  snowRunning=false;
  rockets=[];
  particles=[];
  ctx.clearRect(0,0,W,H);
 }
}

/* TITEL VERWIJDERD: GEEN TEKST IN HET MIDDEN */
if(!controller){
 document.getElementById("screen").classList.remove("hidden");
}

/* CONTROLLER LOGIN */
if(controller){
 const loginArea=document.getElementById("login");
 const controlsArea=document.getElementById("controlsArea");
 const loginStatus=document.getElementById("loginStatus");
 const status=document.getElementById("status");

 onAuthStateChanged(auth,user=>{
  const isAdmin=!!user&&user.uid===ADMIN_UID;
  loginArea.classList.toggle("hidden",isAdmin);
  controlsArea.classList.toggle("hidden",!isAdmin);

  if(user&&!isAdmin){
   signOut(auth);
   loginStatus.textContent="Geen beheerrechten voor dit account.";
  }
 });

 document.getElementById("loginButton").addEventListener("click",async()=>{
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email||!password){
   loginStatus.textContent="Vul e-mailadres en wachtwoord in.";
   return;
  }

  loginStatus.textContent="Bezig met inloggen...";
  try{
   const result=await signInWithEmailAndPassword(auth,email,password);
   if(result.user.uid!==ADMIN_UID){
    await signOut(auth);
    loginStatus.textContent="Dit account heeft geen beheerrechten.";
   }
  }catch(error){
   loginStatus.textContent="Inloggen mislukt: "+error.message;
  }
 });

 document.querySelectorAll("[data-action]").forEach(button=>{
  button.addEventListener("click",async()=>{
   const user=auth.currentUser;
   if(!user||user.uid!==ADMIN_UID){
    status.textContent="Geen beheerrechten.";
    return;
   }

   const action=button.dataset.action;
   const target=document.getElementById("target").value;
   status.textContent="Opdracht verzenden...";

   try{
    await set(ref(db,"show"),{
     action,
     target,
     updatedAt:Date.now()
    });
    status.textContent="Verzonden: "+action+" · "+target;
   }catch(error){
    status.textContent="Verzenden mislukt: "+error.message;
   }
  });
 });

 document.getElementById("logoutButton").addEventListener("click",async()=>{
  await signOut(auth);
  status.textContent="Uitgelogd.";
 });
}

/* SCHERMEN: ANONIEM INLOGGEN EN LUISTEREN */
if(!controller){
 let listenerStarted=false;

 onAuthStateChanged(auth,async user=>{
  if(!user){
   try{
    await signInAnonymously(auth);
   }catch(error){
    console.error("Anonieme login mislukt:",error);
   }
   return;
  }

  if(user.isAnonymous&&!listenerStarted){
   listenerStarted=true;
   onValue(ref(db,"show"),snapshot=>{
    const data=snapshot.val();
    if(data)applyCommand(data);
   },error=>{
    console.error("Firebase leesfout:",error);
   });
  }
 });
}

</script>
</body>
</html>
