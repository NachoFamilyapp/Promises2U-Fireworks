
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080817">
<title>Promises2U Fireworks</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#080817;color:white;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
#screen{
 position:fixed;top:22px;left:25px;z-index:2;
 font-size:12px;letter-spacing:3px;color:#b9bad5
}
#number{font-size:23px;color:white;font-weight:bold;margin-top:7px}
#title{
 position:fixed;top:43%;width:100%;text-align:center;
 pointer-events:none;font-size:clamp(25px,5vw,65px);
 font-weight:bold;letter-spacing:5px;
 text-shadow:0 0 25px #ffffff55;
 opacity:.78
}
#subtitle{
 position:fixed;top:54%;width:100%;text-align:center;
 color:#b9bad5;letter-spacing:4px;font-size:12px
}
#controller{
 position:relative;z-index:5;max-width:650px;
 margin:25px auto;padding:24px;
 background:#15152c;border:1px solid #393958;
 border-radius:20px
}
#controller h1{margin-top:0}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{
 border:0;border-radius:12px;padding:17px;
 font-size:16px;font-weight:bold;cursor:pointer;
 background:#34345d;color:white
}
button.start{background:#d9a52c;color:#171020}
button.stop{background:#9b3548}
select{
 width:100%;padding:14px;border-radius:10px;
 background:#242442;color:white;border:1px solid #555
}
.note{color:#b8b8d3;font-size:13px;line-height:1.6}
.hidden{display:none}
@media(max-width:600px){
 #controller{margin:12px;padding:18px}
 .controls{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<canvas id="fireworks"></canvas>

<div id="screen">
 PROMISES2U · FIREWORKS
 <div id="number">BROWSER 1</div>
</div>

<div id="title">FIREWORKS</div>
<div id="subtitle">A NIGHT TO REMEMBER</div>

<div id="controller" class="hidden">
 <h1>🎆 Fireworks Controller</h1>
 <p class="note">Lokale demonstratiecontroller. Internetbediening voor andere apparaten volgt na Firebase-koppeling.</p>
 <label for="target">Selecteer scherm</label>
 <select id="target">
  <option value="all">Alle browsers</option>
  <option value="1">Browser 1</option>
  <option value="2">Browser 2</option>
  <option value="3">Browser 3</option>
  <option value="4">Browser 4</option>
  <option value="5">Browser 5</option>
 </select>
 <br><br>
 <div class="controls">
  <button class="start" onclick="send('start')">▶ START</button>
  <button onclick="send('pause')">Ⅱ PAUZE</button>
  <button class="stop" onclick="send('stop')">■ STOP</button>
  <button onclick="send('resume')">↻ HERVAT</button>
 </div>
 <p class="note" id="status">Controller gereed.</p>
</div>

<script>
const params=new URLSearchParams(location.search);
const controller=params.has("controller");
const browser=Math.min(5,Math.max(1,Number(params.get("browser"))||1));

const canvas=document.getElementById("fireworks");
const ctx=canvas.getContext("2d");
const palette=[
 ["#ffd166","#ffb703","#fff1a8","#ffffff"],
 ["#70d6ff","#b388ff","#f15bb5","#ffffff"],
 ["#ff595e","#ffca3a","#ffffff","#ff924c"],
 ["#80ed99","#57cc99","#caffbf","#ffffff"],
 ["#ff70a6","#ffd670","#70d6ff","#ffffff"]
];

document.getElementById("number").textContent="BROWSER "+browser;

if(controller){
 document.getElementById("controller").classList.remove("hidden");
 document.getElementById("screen").classList.add("hidden");
 document.getElementById("title").classList.add("hidden");
 document.getElementById("subtitle").classList.add("hidden");
 canvas.classList.add("hidden");
}

let W,H,particles=[],rockets=[],running=true;
let last=0;

function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener("resize",resize);
resize();

function burst(x,y,colors){
 const amount=65+Math.random()*55;
 for(let i=0;i<amount;i++){
  const a=Math.random()*Math.PI*2;
  const speed=1.2+Math.random()*5.5;
  particles.push({
   x,y,
   vx:Math.cos(a)*speed,
   vy:Math.sin(a)*speed,
   life:1,
   decay:.007+Math.random()*.012,
   color:colors[Math.floor(Math.random()*colors.length)],
   size:1+Math.random()*2.5
  });
 }
}

function launch(){
 const colors=palette[browser-1];
 rockets.push({
  x:W*(.12+Math.random()*.76),
  y:H+5,
  target:H*(.13+Math.random()*.55),
  speed:4+Math.random()*3,
  color:colors[Math.floor(Math.random()*colors.length)],
  colors
 });
}

function draw(){
 requestAnimationFrame(draw);
 if(!running)return;

 ctx.fillStyle="rgba(8,8,23,0.20)";
 ctx.fillRect(0,0,W,H);

 if(Math.random()<.035)launch();

 rockets=rockets.filter(r=>{
  r.y-=r.speed;
  ctx.beginPath();
  ctx.arc(r.x,r.y,2.5,0,Math.PI*2);
  ctx.fillStyle=r.color;
  ctx.fill();
  if(r.y<=r.target){
   burst(r.x,r.y,r.colors);
   return false;
  }
  return true;
 });

 particles=particles.filter(p=>{
  p.x+=p.vx;
  p.y+=p.vy;
  p.vy+=.045;
  p.vx*=.985;
  p.life-=p.decay;
  ctx.globalAlpha=Math.max(0,p.life);
  ctx.beginPath();
  ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
  ctx.fillStyle=p.color;
  ctx.fill();
  return p.life>0;
 });
 ctx.globalAlpha=1;
}
draw();

const channel=("BroadcastChannel" in window)
 ?new BroadcastChannel("promises2u-fireworks")
 :null;

function send(action){
 const target=document.getElementById("target").value;
 if(channel)channel.postMessage({action,target});
 document.getElementById("status").textContent=
 "Opdracht: "+action+" · "+(target==="all"?"Alle browsers":"Browser "+target)+
 " · lokale demonstratie";
}

if(channel){
 channel.onmessage=e=>{
  const data=e.data;
  if(data.target!=="all"&&Number(data.target)!==browser)return;
  if(data.action==="start"||data.action==="resume")running=true;
  if(data.action==="pause")running=false;
  if(data.action==="stop"){
   running=false;
   particles=[];
   rockets=[];
   ctx.clearRect(0,0,W,H);
  }
 };
}

if(!controller){
 const colors=palette[browser-1];
 document.getElementById("title").style.color=colors[0];
 document.getElementById("title").textContent=
 browser===1?"GOLDEN FIREWORKS":
 browser===2?"MAGIC COLORS":
 "FIREWORKS SHOW "+browser;
 setTimeout(()=>burst(W/2,H*.35,colors),500);
}

</script>
</body>
</html>
